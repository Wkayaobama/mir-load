remediation:
- id: R01
  symptom: 'inspect: command not found'
  layer: L8
  surfaces: A B C
  cause: A comment line of the sequence typed as a command.
  fix: column -s, -t < .mrload/review/deal_anchors.csv | less -S
  verified: user log 2026-09-14
- id: R02
  symptom: '.mrload/logs/dbt-…log: No such file or directory during the dbt step'
  layer: L10
  surfaces: A B C
  cause: |-
    Relative state dir + cd dbt inside the step: logs and the dbt checkpoint were lost.
  fix: 'git pull (fixed in d4d5dfb: state and ledger paths absolutised).'
  verified: reproduced + fixed
- id: R03
  symptom: 'Not found: Table …mrload_raw.library_hierarchy'
  layer: L8
  surfaces: A B C
  cause: dbt run before walk / bq-init / bq-load.
  fix: |-
    scripts/run_pass1.sh walk → bq-init → bq-load → dbt; scripts/dev/pipeline_state.sh names the next step.
  verified: user log 2026-09-14
- id: R04
  symptom: 'Not found: Table …mrload.silver_library_deal while deal_anchors.csv exists'
  layer: L1
  surfaces: A B C
  cause: |-
    review (Python, offline) ran on the merged code; dbt did not (6-model run predates the merge).
  fix: scripts/run_pass1.sh dbt on the merged branch → PASS=7.
  verified: user log 2026-09-15
- id: R05
  symptom: |-
    Foreign Key constraint references legacy_company_id but it is not a Primary Key column
  layer: L8
  surfaces: A B C
  cause: |-
    Enforced contract renders constraints into BigQuery DDL; the FK pointed at a non-PK column.
  fix: 'git pull (953f6f4: FKs reference company_node_key) → dbt.'
  verified: fixed; user confirmed
- id: R06
  symptom: Sudo is disabled on this machine
  layer: L3
  surfaces: A B
  cause: 'Windows 11 sudo.exe: the bootstrap was started in Git Bash / PowerShell.'
  fix: Run bash scripts/bootstrap_ubuntu.sh INSIDE Ubuntu, without sudo.
  verified: docs/WEZTERM_UBUNTU.md
- id: R07
  symptom: '\r: command not found / script ''not found'''
  layer: L2
  surfaces: A B
  cause: CRLF checkout (Git for Windows autocrlf before .gitattributes).
  fix: |-
    git add --renormalize . && git rm -r -q --cached . && git reset -q --hard; scripts/dev/crlf_check.sh
  verified: docs/WEZTERM_UBUNTU.md
- id: R08
  symptom: 'Permission denied: scripts/run_pass1.sh'
  layer: L2
  surfaces: A (zip copied to the Linux side)
  cause: Exec bits dropped by a Windows extraction.
  fix: |-
    chmod +x scripts/*.sh scripts/dev/*.sh scripts/e2e/bin/*  — or convert the folder in place (restores modes).
  verified: verified in this session
- id: R09
  symptom: 'env clinic: ''not a git repository'' warning; install_git_hooks refuses'
  layer: L7
  surfaces: A (zip)
  cause: No .git in an unzipped folder.
  fix: |-
    git init && git remote add origin … && git fetch origin <branch> && git reset --hard origin/<branch> && scripts/dev/install_git_hooks.sh (printed by the clinic).
  verified: verified in this session
- id: R10
  symptom: gcloud auth application-default login --scopes=…drive rejected
  layer: L5
  surfaces: A B C
  cause: gcloud's own OAuth client may not request Drive scopes on the ADC path.
  fix: |-
    scripts/gauth.sh (gcloud auth login --enable-gdrive-access --update-adc, quota project, API enablement).
  verified: gauth.sh header; runbook
- id: R11
  symptom: walk returns 0 nodes / preflight dies on the probe
  layer: L5
  surfaces: A B C
  cause: |-
    The logged-in account cannot see the scope root, or drive_id in the card is wrong.
  fix: |-
    scripts/dev/auth_check.sh; log in with the owning account; check context/cards/library.yaml.
  verified: runbook
- id: R12
  symptom: 403 on hs-props
  layer: L6
  surfaces: A B C
  cause: Private app lacks the schema-write scope of that object type.
  fix: Add the scope named in the 403 body; re-run hs-props (idempotent).
  verified: runbook P
- id: R13
  symptom: dbt test FAIL at the gate
  layer: L8
  surfaces: A B C
  cause: Cardinality violation in Drive (multi-parent file, duplicate company name, …).
  fix: |-
    scripts/dev/dbt_failures.sh → fix in Drive → walk; the tracker marks bq-load… stale so you re-enter in order.
  verified: rehearsal dirty scenario
- id: R14
  symptom: Duplicate notes / files / deals after switching surface
  layer: L9
  surfaces: A B C
  cause: Live steps keyed on the local SQLite ledger.
  fix: |-
    One surface for attach-upload / attach-notes / deals-live, or copy .mrload/ledger.sqlite; future ledger-import from mrload_raw.
  verified: run sheet / runbook
- id: R15
  symptom: Notebook output reads g.a.r.b.l.e.d
  layer: L8
  surfaces: A
  cause: wsl.exe writes UTF-16 when captured.
  fix: Re-run the Switches cell (helpers set WSL_UTF8=1).
  verified: helpers.ps1
- id: R16
  symptom: mr-load-helpers.ps1 not found
  layer: L8
  surfaces: A
  cause: $RepoWin does not point at the clone / notebook opened outside the repo.
  fix: |-
    Set $RepoWin = 'C:\Users\ayaobama\Documents\AnthonySalesOps\Codebase\miraex\mir-load' in the Switches cell.
  verified: notebooks
- id: R17
  symptom: No prompt appears for Set-EnvKey
  layer: L6
  surfaces: A
  cause: Extension build without Read-Host support.
  fix: 'Terminal: scripts/dev/env_set.sh HUBSPOT_SANDBOX_TOKEN (silent prompt).'
  verified: compass 4.2
- id: R18
  symptom: 'deals-dry: no_company_resolved on every row'
  layer: L8
  surfaces: A B C
  cause: Pass 2 attempted before companies-live.
  fix: Run companies-dry/live (and attach-notes for the note associations) first.
  verified: runbook 7
- id: R19
  symptom: agate RuntimeWarning 'table_owner' after dbt
  layer: L8
  surfaces: A B C
  cause: dbt docs generate on BigQuery.
  fix: Harmless; no action.
  verified: user log 2026-09-14
- id: R20
  symptom: 'dbt deps: ''not a gzip file'''
  layer: L4
  surfaces: sandbox only
  cause: Package download altered by an outbound proxy.
  fix: |-
    git clone --depth 1 --branch 1.4.1 https://github.com/dbt-labs/dbt-utils dbt/dbt_packages/dbt_utils (then dbt deps is skipped).
  verified: this container only
- id: R21
  symptom: 'deals-dry / deals-live: failed ×N, error create_error'
  layer: L8
  surfaces: A B C
  cause: |-
    dealstage / pipeline value is not a STAGE / PIPELINE ID of the portal the token belongs to (sandbox ids differ from production).
  fix: |-
    Read the ids once: set -a; source .env; set +a; curl -s -H "Authorization: Bearer $HUBSPOT_SANDBOX_TOKEN" https://api.hubapi.com/crm/v3/pipelines/deals | python3 -c 'import json,sys
    for p in json.load(sys.stdin)["results"]:
        print(p["id"], p["label"]); [print("   ", s["id"], s["label"]) for s in p["stages"]]' — then fill pipeline / dealstage in deal_decisions.csv or set MRLOAD_DEAL_PIPELINE / MRLOAD_DEAL_STAGE.
  verified: sandbox pass 2 (6 failed rows); deals_summary prints the hint
- id: R22
  symptom: |-
    deals-dry: no_company_resolved on rows whose company folder is year-prefixed (2021_ELTA, 2022_Aselsan)
  layer: L8
  surfaces: A B C
  cause: |-
    Pass 1 never resolves engagement folders (companies.py filters company_folder); before 6f38600 pass 2 had no company to associate with.
  fix: |-
    git pull (6f38600): pass 2 salvages by searching the remainder name (ELTA); found → matched_by_name_pass2 and the deal associates to it; not found → not_in_portal_pass2 and a hubspot_companies_import row. The pipeline never creates the company.
  verified: 'sandbox 2026-09-30: 4 ELTA rows salvaged → company 35988056623'
- id: R23
  symptom: The HubSpot import CSVs cannot be handed to the wizard from Cloud Shell
  layer: L9 / L11
  surfaces: C
  cause: |-
    The files live in the Cloud Shell clone's .mrload/review/; no desktop, no file transfer to the browser that runs the wizard.
  fix: |-
    git pull (765cd01): ledger-export loads them as mrload_raw.hubspot_deals_import / hubspot_companies_import. Console: query → Save results → Sheets/CSV → Import. Terminal: bq query --use_legacy_sql=false --format=csv --max_rows=100000 '…' > ~/f.csv && cloudshell download ~/f.csv
  verified: probe 2026-09-30; rehearsal checks 46–47
- id: R24
  symptom: How to look at or edit a review CSV on Cloud Shell
  layer: L8
  surfaces: C
  cause: |-
    No desktop editor; column -s, -t misaligns a row whose quoted field contains a comma.
  fix: |-
    cloudshell edit <file> (Cloud Shell Editor) or nano to edit; column -s, -t < <file> | less -S for a glance; less -S <file> for the exact text; cloudshell download <file> then ⋮ Upload and mv ~/<file> ~/mir-load/.mrload/review/ for a laptop round trip.
  verified: this session (L14)
- id: R25
  symptom: |-
    A company-level working folder (Drafts/pre-PO) became a HubSpot company in pass 1 and anchors a deal
  layer: L8
  surfaces: A B C
  cause: |-
    The walker classifies every folder at company level as company_folder unless its name is year-prefixed; companies-live created it in the sandbox.
  fix: |-
    Before the production walk: add the folder to the exclusions in context/cards/library.yaml, delete the sandbox company, re-run walk → bq-load → dbt → review. Not done yet — flagged from the probe.
  verified: 'probe 2026-09-30 (row 1: company_name Drafts/pre-PO, id 58614964830)'
