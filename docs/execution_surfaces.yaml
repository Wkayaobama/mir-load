title: mr-load — three execution surfaces, one pipeline
verdict: |-
  Verdict: from the acquisition of the code to the last step, motion A (zip or clone → VS Code → Polyglot notebooks) yields the same artefacts as motions B (WezTerm → Ubuntu terminal) and C (Cloud Shell), because every step cell runs the same scripts/run_pass1.sh inside an Ubuntu that the same bootstrap provisioned, against the same BigQuery project, Drive root and HubSpot portal. The layers that are NOT parallel are all outside the pipeline itself: acquiring and updating the code (a zip has no git), file modes, package provisioning, and the locality of the SQLite ledger for the live HubSpot steps. Each has a remediation in the Layers sheet. Reconciled through pass 2 on 2026-09-30: the orphan salvage (6f38600) and the BigQuery materialisation of the HubSpot import files (765cd01) were run from Cloud Shell and probed with bq query — the table is the same from every surface. See Layers L14–L15, Pipeline steps 15b–15c, Remediation R21–R25, the last four Equality checks, and docs/EXECUTION_SURFACES.md for the narrative.
legend: |-
  Legend: Parity column colours — green Parallel, yellow Conditional, orange Divergent. Layers L0–L15 are the execution layer subdivided from acquisition to updates; Pipeline steps are the 16 runner steps plus the pass-2 wizard route (15b–15c), status and rollback; Remediation is the catalogue of observed and simulated failures (R01–R25); Equality checks lists what to compare between two surfaces after each stage. Source: the mr-load repository on branch claude/mr-load-library-system-dphpbj at 2026-09-30 (765cd01), the Cloud Shell logs shared on 2026-09-14/15, and simulations run in the development container (non-git folder, in-place conversion, relative state dir).
surfaces:
  A: A · Zip / clone → VS Code → Polyglot notebook (PowerShell cells)
  B: B · WezTerm → Ubuntu terminal (WSL or Docker)
  C: C · Cloud Shell terminal
motions:
- motion: A · Zip / clone → VS Code → Polyglot notebook
  acquire: 'Download ZIP (least optimal: no .git) or VS Code Git: Clone into a chosen path'
  ubuntu: WSL distro or Docker image (compass notebook provisions it)
  driver: 'PowerShell cells: Invoke-Step → wsl.exe / docker run → scripts/run_pass1.sh'
  state: 'the clone the route uses: WSL ~/mir-load or the Windows folder'
  assessment: |-
    Best guided path; zip variant acceptable only after in-place conversion to a clone
- motion: B · WezTerm → Ubuntu terminal
  acquire: git clone (WSL side or Windows for Docker)
  ubuntu: same WSL distro or Docker image as A
  driver: type scripts/run_pass1.sh <step>; live steps ask YES
  state: same clone as A when the same distro/folder is used
  assessment: Same result as A with fewer moving parts; no notebook prerequisites
- motion: C · Cloud Shell
  acquire: git clone in the persistent home
  ubuntu: Cloud Shell VM (gcloud/bq built in; run the bootstrap for the venv)
  driver: type scripts/run_pass1.sh <step>
  state: ~/mir-load/.mrload in the persistent home
  assessment: |-
    Preferred for probing: zero local setup, same code; watch package provisioning (L4) and ledger locality (L9)
layers:
- id: L0
  layer: Acquire the code
  A: |-
    GitHub → Download ZIP of the branch → extract to e.g. C:\Users\ayaobama\Documents\AnthonySalesOps\Codebase\miraex\mir-load (no .git, no history, exec bits dropped by Explorer). Alternative on the same motion: VS Code → Git: Clone into that folder.
  B: |-
    git clone https://github.com/Wkayaobama/mir-load.git — on the Linux side (~/mir-load) for WSL, on Windows for Docker.
  C: |-
    git clone https://github.com/Wkayaobama/mir-load.git ~/mir-load in the persistent home.
  parity: Divergent
  diverges: |-
    A zip is a snapshot without .git: no branch, no git pull, no pre-commit guard, no exec bits after a Windows extraction. Clone variants of A are Parallel with B and C.
  remediation: |-
    Convert the folder into a clone IN PLACE (keeps .env and .mrload/): git init && git remote add origin … && git fetch origin <branch> && git reset --hard origin/<branch> && scripts/dev/install_git_hooks.sh. scripts/dev/env_clinic.sh prints this recipe when it finds no .git.
  verified: |-
    Simulated in this session: unzipped folder → convert → branch, exec bits and hook restored, working tree clean, .env kept.
- id: L1
  layer: Pick the commit
  A: |-
    Zip = HEAD of the branch at download time; drifts silently afterwards (the FK fix 953f6f4 and the log-path fix d4d5dfb would be missing from an older zip).
  B: |-
    git fetch origin && git checkout claude/mr-load-library-system-dphpbj && git pull
  C: same as B
  parity: Conditional
  diverges: |-
    Same result only if all surfaces are on the same commit. Symptom of drift: the dbt run builds 6 models instead of 7, review has no deal_anchors.csv.
  remediation: |-
    Compare git log -1 on each surface (after conversion on A). Re-download or git pull. scripts/dev/pipeline_state.sh does not know about commits: check the model count in the dbt output (PASS=7).
  verified: |-
    Observed on the user's Cloud Shell: 6-model run and per-PDF decisions = pre-merge code.
- id: L2
  layer: Line endings and file modes
  A: |-
    GitHub zip content is LF. Windows extraction drops the executable bit: harmless on /mnt/c (WSL drvfs shows 777) and on Docker bind mounts, breaks a Linux-side COPY of the folder (Permission denied on scripts/run_pass1.sh).
  B: .gitattributes pins LF on clone; modes come from the index.
  C: 'Linux clone: LF and modes from the index.'
  parity: Conditional
  diverges: |-
    Only the zip motion can lose modes; only a Windows checkout without .gitattributes can be CRLF.
  remediation: |-
    scripts/dev/crlf_check.sh (scans the tree when there is no git index); chmod +x scripts/*.sh scripts/dev/*.sh scripts/e2e/bin/*; or the in-place conversion, which restores modes.
  verified: 'Verified: chmod -x then git reset --hard restored -rwxr-xr-x.'
- id: L3
  layer: Ubuntu runtime
  A: |-
    WSL distro (compass A1) or Docker image built from scripts/dev/Dockerfile (compass B2). The notebook reaches it with wsl.exe -d <distro> -e bash -lc … or docker run --rm -v <clone>:/work … bash -lc ….
  B: |-
    The same WSL distro or Docker image, opened as a WezTerm tab (wezterm/mr-load.lua) or scripts/ubuntu_shell.sh.
  C: |-
    Cloud Shell VM (Debian-based, gcloud and bq preinstalled, home persists, VM ephemeral).
  parity: Parallel
  diverges: |-
    A and B share the very same Ubuntu. C is a different distribution with the same tools; the bootstrap script handles both.
  remediation: |-
    bash scripts/bootstrap_ubuntu.sh --no-rehearsal on every Ubuntu (A4 in the compass for WSL; the Dockerfile for Docker; once in Cloud Shell).
  verified: 'bootstrap_ubuntu.sh guards: refuses Git Bash/PowerShell and sudo.'
- id: L4
  layer: Python and dbt provisioning
  A: |-
    WSL: .venv from the bootstrap. Docker: /opt/venv baked into the image. Same requirements files.
  B: Same as A (same Ubuntu).
  C: |-
    Observed: packages in ~/.local (pip --user, python3.12) rather than a venv; same requirements files, versions resolved on a different day.
  parity: Conditional
  diverges: |-
    Version drift is possible because requirements pin lower bounds (dbt-bigquery>=1.10). Behaviour is the same unless a dbt minor release changes something.
  remediation: |-
    Use the bootstrap everywhere → .venv; source .venv/bin/activate each session; compare dbt --version and pip freeze | grep -E 'dbt|duckdb' across surfaces; pin exact versions if a difference ever shows.
  verified: The notebook verify cells (A5/B4) print the versions.
- id: L5
  layer: Google credentials (Drive + BigQuery)
  A: |-
    scripts/gauth.sh in a terminal opened by Open-UbuntuTerminal; ADC lands in ~/.config/gcloud of the distro or in the mrload-gcloud Docker volume.
  B: scripts/gauth.sh in the WezTerm tab (same ADC location as A).
  C: |-
    scripts/gauth.sh too: Cloud Shell's built-in credentials carry the cloud-platform scope, not Drive.
  parity: Parallel
  diverges: |-
    Same script, same sequence (gcloud auth login --enable-gdrive-access --update-adc, quota project, API enablement). Only the Google identity can differ.
  remediation: |-
    scripts/dev/auth_check.sh on each surface: same masked account, 'Drive: scope root readable', 'BigQuery: query OK'.
  verified: The rejected --scopes variant is documented in gauth.sh and the runbook.
- id: L6
  layer: .env and secrets
  A: |-
    Set-EnvKey <KEY> (masked Read-Host) pipes the value into scripts/dev/env_set.sh inside Ubuntu; nothing is stored in the notebook (.dib keeps no outputs).
  B: |-
    scripts/dev/env_set.sh KEY (silent prompt) or an editor; scripts/dev/env_clinic.sh --fix.
  C: Same as B.
  parity: Parallel
  diverges: |-
    .env is per clone: three copies to keep aligned (MRLOAD_BQ_PROJECT, HUBSPOT_SANDBOX_TOKEN, HUBSPOT_SANDBOX_PORTAL_ID).
  remediation: |-
    scripts/dev/env_clinic.sh on each surface; it masks values and flags placeholders, CRLF, mode and the production portal.
  verified: env_clinic tested in repo and on a non-git folder.
- id: L7
  layer: Git safety net (no secret ever committed)
  A: |-
    Zip: there is no git, so nothing can be committed from that folder; the clinic says so as a warning and prints the conversion recipe. Clone: install_git_hooks.sh + guard_proof.sh as on B/C.
  B: |-
    scripts/dev/install_git_hooks.sh; scripts/dev/guard_proof.sh (force-stages .env, commit must be refused).
  C: Same as B.
  parity: Divergent
  diverges: |-
    The guard exists only where .git exists. On the zip motion the risk appears the day the folder is turned into a repo.
  remediation: |-
    Convert in place, then install_git_hooks.sh; the .gitignore already excludes .env, .env.*, .mrload/.
  verified: Hook refusal verified for a staged .env and a fake service-account key.
- id: L8
  layer: Driving a step
  A: |-
    Invoke-Step '<step>' → scripts/run_pass1.sh <step> inside Ubuntu; LIVE steps refused until $ConfirmLive = $true, then YES_ALL=1 answers the runner's prompts. Invoke-Sequence -UntilLive / -Through and Invoke-NextStep chain steps in order.
  B: |-
    scripts/run_pass1.sh <step>; LIVE steps show the dry run and ask you to type YES.
  C: Same as B.
  parity: Parallel
  diverges: |-
    Identical script, gates, logs and checkpoints. The only mechanical differences: prompts vs $ConfirmLive, and wsl.exe output encoding (helpers set WSL_UTF8=1).
  remediation: |-
    None needed. If notebook output looks like g.a.r.b.l.e.d, re-run the Switches cell (sets WSL_UTF8).
  verified: |-
    Run sheet exercised on the linux route: refusal, failed checkpoint, sequence halt, next step.
- id: L9
  layer: 'State: ledger, checkpoints, cache'
  A: .mrload/ of the clone the route uses (WSL clone or Windows clone).
  B: |-
    .mrload/ of the WezTerm clone (the same clone as A when the same WSL distro / Windows folder is used).
  C: .mrload/ of the Cloud Shell clone.
  parity: Divergent
  diverges: |-
    attach-upload, attach-notes and deals-live are idempotent only through the SQLite ledger of the clone that ran them. A second clone with an empty ledger uploads and creates again (duplicate files, notes, deals).
  remediation: |-
    Run the live HubSpot steps from ONE surface, or copy .mrload/ledger.sqlite before switching. Proper fix (not built): a ledger-import step rebuilding the SQLite ledger from the four mrload_raw tables written by ledger-export.
  verified: Rule added to the run sheet and the runbook (de03946).
- id: L10
  layer: Logs and 'where am I'
  A: Get-PipelineState, Invoke-Ubuntu 'scripts/dev/last_log.sh'.
  B: |-
    scripts/dev/pipeline_state.sh; scripts/dev/last_log.sh; task 'mr-load: pipeline state'.
  C: Same as B.
  parity: Parallel
  diverges: |-
    Same files, but per clone (L9). Before d4d5dfb the dbt step lost its logs and checkpoint on every surface with a relative state dir.
  remediation: git pull (d4d5dfb absolutises the state dir).
  verified: Reproduced and fixed in this session.
- id: L11
  layer: Shared truth
  A: |-
    BigQuery project and datasets (MRLOAD_BQ_PROJECT), the HubSpot portal of the token, the Drive scope root: identical by construction.
  B: Same.
  C: Same.
  parity: Parallel
  diverges: None, provided .env agrees (L6) and the Google identity agrees (L5).
  remediation: |-
    scripts/run_pass1.sh preflight prints the project, the portal id and the depth-1 node count: compare them.
  verified: —
- id: L12
  layer: Offline probe (no credentials)
  A: |-
    Notebook section 8: unit tests, e2e rehearsal clean (41/41), dirty (stops at the dbt gate).
  B: |-
    python -m pytest tests -q --ignore=tests/e2e; scripts/e2e_rehearsal.sh; SCENARIO=dirty scripts/e2e_rehearsal.sh
  C: 'Same as B (needs requirements-dev: duckdb, dbt-duckdb).'
  parity: Parallel
  diverges: None.
  remediation: —
  verified: 41/41 on this container.
- id: L13
  layer: Updates over time
  A: |-
    Zip: re-download and overwrite (state in .mrload/ survives only if you extract over the same folder carefully). Clone: git pull.
  B: git pull
  C: git pull
  parity: Divergent
  diverges: The zip motion has no incremental update path.
  remediation: Convert in place once; afterwards git pull like B and C.
  verified: —
- id: L14
  layer: 'Pass-2 decisions: view and edit review/deal_decisions.csv'
  A: |-
    VS Code on the clone (Rainbow CSV) — the file is under .mrload/review/ of the WSL or Windows clone; or Invoke-Ubuntu 'column -s, -t < .mrload/review/deal_decisions.csv' to print it.
  B: |-
    column -s, -t < .mrload/review/deal_decisions.csv | less -S (← → scroll, q); edit with nano or VS Code (WSL remote).
  C: |-
    cloudshell edit .mrload/review/deal_decisions.csv (Cloud Shell Editor, Ctrl+S); or nano; view with column -s, -t < … | less -S; or cloudshell download <file> → edit on the laptop → ⋮ Upload → mv ~/deal_decisions.csv ~/mir-load/.mrload/review/
  parity: Conditional
  diverges: |-
    The file is per clone (L9): edit it on the surface that will run deals-dry / deals-live. Cloud Shell has no desktop editor, hence cloudshell edit or the download/upload round trip. column misaligns a row whose quoted field contains a comma (glance only). The writer emits CRLF; the reader accepts LF, CRLF or a mix, so any editor is fine.
  remediation: |-
    None needed. Bulk approve of every row: sed -i -E '2,$ s/,N,([^,]*)\r?$/,Y,\1/' .mrload/review/deal_decisions.csv (approve is the 15th column, before operator_note). Per-row approval is the point of the file, so prefer the editor.
  verified: |-
    Cloud Shell run of 2026-09-30: review → edit → deals-dry → ledger-export; the rehearsal flips approve on the same file layout.
- id: L15
  layer: BigQuery materialisation of the HubSpot import files + probe
  A: |-
    Invoke-Step 'ledger-export' (LIVE BQ_LOAD) loads review/hubspot_deals_import.csv and hubspot_companies_import.csv as mrload_raw.hubspot_deals_import / hubspot_companies_import; probe: Invoke-Ubuntu 'bq query --use_legacy_sql=false "select dealname, company_name, company_hs_object_id, op_company_status, op_approve, hs_object_id from \`wisekeybq.mrload_raw.hubspot_deals_import\` order by company_name, dealname"'
  B: |-
    scripts/run_pass1.sh ledger-export; probe: bq query --use_legacy_sql=false 'SELECT dealname, company_name, company_hs_object_id, op_company_status, op_approve, hs_object_id FROM `wisekeybq.mrload_raw.hubspot_deals_import` ORDER BY company_name, dealname'
  C: |-
    Same commands; bq is preauthenticated in Cloud Shell. Wizard file without the console: bq query --use_legacy_sql=false --format=csv --max_rows=100000 '<the query the step printed>' > ~/hubspot_deals_import.csv && cloudshell download ~/hubspot_deals_import.csv
  parity: Parallel
  diverges: |-
    None: the two tables are shared truth (L11) for the import files, so the wizard's input no longer depends on a clone's review/ folder or on a file transfer. They mirror the ledger of the clone that ran ledger-export (L9) plus that clone's deal_decisions.csv; deals-dry outcomes that are not persisted (would_create) do not appear.
  remediation: |-
    Console route: BigQuery console → SELECT * EXCEPT(pipeline, dealstage, op_company_status, op_api_status, op_api_error) … WHERE op_approve = 'Y' → Save results → Sheets/CSV → HubSpot Import (hs_object_id → Deals·Record ID, company_hs_object_id → Companies·Record ID). Loader route: deals-live creates and associates the salvaged deals through the API (no Cloud Function needed).
  verified: |-
    Probe of 2026-09-30 on the sandbox (portal 49610528) from Cloud Shell: 10 rows = the 10 inferred anchors; 4 ELTA rows salvaged (op_company_status salvaged, company_hs_object_id 35988056623 found by name, never created); 6 resolved from pass 1; op_approve N and hs_object_id NULL everywhere (no deal created yet). Row for row the content of review/hubspot_deals_import.csv (rehearsal check 47: byte-identical load).
steps:
