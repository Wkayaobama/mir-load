# Entity card — mr-load Library (Miraex Drive → HubSpot notes-on-company)
# Format: ic-load context/cards/_schema.md. Loaded by pipeline/library_files/card.py.
entity: Library
object_type: notes            # assets land in HubSpot as notes with file attachments

domain: "30 Sales"

medallion:
  bronze: mrload_raw.library_hierarchy           # walker output, bq load
  silver: mrload.silver_library_index            # dbt, 19-col parity with icalps
  companies: mrload.silver_library_company       # dbt, one row per company folder
  gold: hubspot.notes                            # via uploader (upload → note → associate)

primary_key:
  source: node_key            # "30 Sales|20 opportunities and customer data|Quantum|Toshiba|file.pdf"
  canonical: legacy_library_id
  type: string

scope:
  # Pass 1 walks these roots only. Tradeshows (ordinal 70) are indexable but
  # explicitly OUT of the present pipeline.
  roots:
    - name: "20 opportunities and customer data"
      drive_id: 1If3SX0GD6FJypMy23na6HizFD6gciw_0
      path_prefix: "30 Sales"
      segment_depth: 1
  exclude_segments:           # regex, matched against every path segment; subtree pruned
    - "^70\\b"
    - "(?i)tradeshow"
    - "(?i)^events & tradeshows$"

levels:
  - depth: 1
    role: segment             # e.g. Quantum
  - depth: 2
    role: company             # folder name = company name (e.g. Toshiba)
  - depth: 3
    role: deal_anchor_candidate   # the FIRST folder level under a company folder (see deal_inference)
  - depth: ">=3"
    role: asset               # every file under the company folder is a library asset

cardinality:
  - relation: "Segment → Company"
    type: "1:N"
    description: "One segment folder holds many company folders; company name unique within segment"
  - relation: "Company → Library"
    type: "1:N"
    description: "One company folder anchors many assets (files at any depth beneath it)"
  - relation: "Library → Company"
    type: "N:1"
    description: "Every asset has exactly one company anchor (company_node_key)"
    violation_policy: REJECT
  - relation: "Drive node → parent"
    type: "N:1"
    description: "Drive is a DAG; multi-parent nodes (parents_count > 1) violate the tree assumption"
    violation_policy: REJECT
  - relation: "Company → Deal"
    type: "1:N"
    description: "A company folder holds zero or more inferred deals (qualified level-3 folders, plus PO/Billing PDFs sitting directly under the company)"
  - relation: "Deal → Company"
    type: "N:1"
    description: "Every inferred deal anchors to exactly one company (silver_library_deal.legacy_company_id)"
    violation_policy: REJECT
  - relation: "Library → Deal"
    type: "N:0..1"
    description: "A file beneath a qualified level-3 folder carries that deal (legacy_deal_id); files directly under the company carry none, except PO/Billing PDFs which anchor themselves"
    violation_policy: REJECT      # when set, legacy_deal_id must exist in silver_library_deal

# ── Deal inference (side branch walker-deal-depth3) ─────────────────────────
# Structural part (walker): deal_node_key = the level-3 folder (first folder under the company),
# inherited by everything beneath it. Nothing else can be an anchor. Companies are untouched.
# Heuristic part (silver_library_deal, iterated here without re-walking): a candidate qualifies
# when its subtree holds at least `min_pdf_in_subtree` PDF (a quote exists) AND its name is not
# exhibition/tradeshow-shaped. Contestable by design: result first, refine later.
# Other documents beneath a qualified anchor carry legacy_deal_id but are NOT associated to the
# deal in pass 2 (only PO/Billing PDFs are); they are candidates for the notes API later.
deal_inference:
  anchor_level: 3
  qualify:
    min_pdf_in_subtree: 1
  exclude_name_patterns:          # applied case-insensitively; mirrored by dbt var deal_exclude_regex
    - tradeshow
    - trade show
    - exhibition
    - exibition
    - expo
    - events
  self_anchor_classes: [deal_candidate]   # PO/Billing PDFs directly under the company anchor themselves
  pass_2_associates: [deal_candidate]     # note → deal only for these; other documents deferred

asset_classification:
  # First match wins. Applied to files only. Pass 1 attaches ALL classes as
  # notes on the company; the class only routes the second pass / review queue.
  - class: deal_candidate
    when: "extension == pdf and name ~ (?i)(^|[^a-z0-9])(PO|Billing)([^a-z0-9]|$)"
    pass: 2
    description: "PO / Billing PDFs are ALSO indexed as deals in a separate pass (not during DFS)"
  - class: parked_for_review
    when: "extension == pdf"
    pass: review
    description: "All other PDFs parked awaiting operator review before deal processing"
  - class: shortcut
    when: "mime == application/vnd.google-apps.shortcut"
    pass: skip
  - class: asset
    when: default

fk_dependencies:
  - entity: Company
    violation_policy: REJECT
    staging_fk: silver_library_index.company_node_key
    references: silver_library_company.company_node_key
    description: "An asset cannot be attached if its company folder was not resolved"

import_order: 2               # Company resolution (1) precedes note attach (2)

hubspot:
  attach_as: note
  note_association: "note → company (default association; HUBSPOT_DEFINED 190)"
  company_resolution:
    strategy: search_by_name_then_create
    search: "POST /crm/v3/objects/companies/search — name EQ folder name"
    create_gate: MRLOAD_APPROVE_COMPANY_CREATE
  gates:
    files_upload: MRLOAD_APPROVE_FILES_UPLOAD
    file_notes_post: MRLOAD_APPROVE_FILE_NOTES_POST
    unmigrate: MRLOAD_APPROVE_UNMIGRATE

  # ── Schema propagation into HubSpot ──────────────────────────────────────
  # The pipeline writes only built-in properties (name/description, hs_note_body,
  # hs_attachment_ids, dealname…). The library schema reaches HubSpot through
  # StackSync (BigQuery silver → HubSpot object, matched on the record id that
  # ledger-export wrote back). StackSync never creates a property definition, so
  # `run_pass1.sh hs-props` (before dbt) creates the ones below — idempotent, never
  # modifies or deletes an existing definition — and `hs-props-verify` (after dbt)
  # checks each against the built silver model (dbt catalog) and writes the
  # StackSync mapping sheet: .mrload/review/stacksync_mapping.csv
  properties:
    gate: MRLOAD_APPROVE_PROPERTY_CREATE
    group: { name: mrload_library, label: "mr-load library index" }
    objects:
      companies:
        source_table: silver_library_company
        match: { column: hs_company_id, hubspot: hs_object_id }
        fields:
          - { name: mrload_company_node_key,    column: company_node_key,     type: string,   label: "Library company node key",       description: "Path-as-index key of the company folder (30 Sales|20 opportunities…|Segment|Company)" }
          - { name: mrload_legacy_company_id,   column: legacy_company_id,    type: string,   label: "Legacy company id",              description: "Library id of the company folder (3020Q… scheme)" }
          - { name: mrload_segment,             column: segment,              type: string,   label: "Library segment" }
          - { name: mrload_drive_folder_id,     column: drive_id,             type: string,   label: "Drive folder id" }
          - { name: mrload_drive_link,          column: link,                 type: string,   label: "Drive folder link" }
          - { name: mrload_asset_count,         column: asset_count,          type: number,   label: "Library assets (files)" }
          - { name: mrload_deal_candidate_count, column: deal_candidate_count, type: number,  label: "Library PO/Billing PDFs" }
          - { name: mrload_parked_count,        column: parked_count,         type: number,   label: "Library PDFs parked for review" }
          - { name: mrload_drive_modified_at,   column: drive_modified_at,    type: datetime, label: "Drive folder modified at" }
          - { name: mrload_resolution_status,   column: resolution_status,    type: string,   label: "mr-load resolution status",      description: "matched_by_name | created | resolved_from_ledger" }
      notes:
        source_table: silver_library_index
        match: { column: hs_note_id, hubspot: hs_object_id }
        fields:
          - { name: mrload_legacy_library_id,   column: legacy_library_id,    type: string,   label: "Legacy library id",              description: "Canonical id of the indexed file" }
          - { name: mrload_legacy_company_id,   column: legacy_company_id,    type: string,   label: "Legacy company id" }
          - { name: mrload_node_key,            column: node_key,             type: string,   label: "Library node key" }
          - { name: mrload_file_path,           column: legacy_file_path,     type: string,   label: "Library file path" }
          - { name: mrload_file_name,           column: legacy_file_name,     type: string,   label: "Library file name" }
          - { name: mrload_asset_class,         column: asset_class,          type: string,   label: "Library asset class",            description: "asset | deal_candidate | parked_for_review" }
          - { name: mrload_libr_category,       column: libr_category,        type: string,   label: "Library category" }
          - { name: mrload_extension,           column: extension,            type: string,   label: "File extension" }
          - { name: mrload_drive_file_id,       column: drive_file_id,        type: string,   label: "Drive file id" }
          - { name: mrload_drive_link,          column: legacy_file_link,     type: string,   label: "Drive file link" }
          - { name: mrload_drive_md5,           column: drive_md5,            type: string,   label: "Drive md5" }
          - { name: mrload_drive_size,          column: drive_size,           type: number,   label: "Drive size (bytes)" }
          - { name: mrload_drive_modified_at,   column: libr_updated_at,      type: datetime, label: "Drive file modified at" }
          - { name: mrload_hs_file_id,          column: hs_file_id,           type: string,   label: "HubSpot file id (phase 1 upload)" }
          - { name: mrload_legacy_deal_id,      column: legacy_deal_id,       type: string,   label: "Legacy deal id",                 description: "Deal anchor of the file (NULL when none); the later note → deal association key" }
      deals:
        source_table: silver_library_deal
        match: { column: hs_deal_id, hubspot: hs_object_id }
        fields:
          - { name: mrload_legacy_deal_id,      column: legacy_deal_id,       type: string,   label: "Legacy deal id",                 description: "Library id of the deal anchor (level-3 folder, or the PO/Billing PDF itself)" }
          - { name: mrload_deal_node_key,       column: deal_node_key,        type: string,   label: "Library deal node key" }
          - { name: mrload_anchor_kind,         column: anchor_kind,          type: string,   label: "Deal anchor kind",               description: "folder | file" }
          - { name: mrload_legacy_company_id,   column: legacy_company_id,    type: string,   label: "Legacy company id" }
          - { name: mrload_segment,             column: segment,              type: string,   label: "Library segment" }
          - { name: mrload_drive_folder_id,     column: drive_id,             type: string,   label: "Drive id of the anchor" }
          - { name: mrload_drive_link,          column: link,                 type: string,   label: "Drive link of the anchor" }
          - { name: mrload_pdf_count,           column: pdf_count,            type: number,   label: "PDFs beneath the anchor" }
          - { name: mrload_deal_candidate_count, column: deal_candidate_count, type: number,  label: "PO/Billing PDFs beneath the anchor" }
          - { name: mrload_asset_count,         column: asset_count,          type: number,   label: "Files beneath the anchor" }
          - { name: mrload_drive_modified_at,   column: drive_modified_at,    type: datetime, label: "Anchor modified at" }

silver_validation:
  stop_checks:
    - unique_node_key
    - parent_key_references_node_key
    - no_multi_parent_nodes
    - no_excluded_scope_nodes
    - company_name_unique_within_segment
    - deal_candidates_are_pdf
  warn_checks:
    - asset_has_company_anchor        # loose files at segment level are reported, not attached

pipeline_status:
  pass_1_live_push_ready: false
  blockers:
    - "Share scope root with the service account (silent-failure step)"
    - "Company create + upload + note gates default DRY"
  deferred:
    - "Pass 2 (this branch): deals keyed on the inferred anchor; non-PO/Billing documents beneath an anchor await note → deal association"
    - "Tradeshows (70) indexing"
  runner_entity_arg: library
