# mr-load pass 1 — ansible-orchestrated, localhost control node.
#
#   ansible-playbook -i ansible/inventory.ini ansible/playbook.yml
#   ansible-playbook ... -e approve_bq_load=1 -e approve_company_create=1
#
# Tasks are ordinary `command` invocations of the python runner and dbt; the
# playbook is the ordered "modules" list, the runner is the module body.
- name: mr-load library pass 1 (30 Sales domain → companies + notes)
  hosts: control
  gather_facts: false
  vars_files:
    - group_vars/all.yml
  environment:
    MRLOAD_LEDGER_PATH: "{{ ledger_path }}"
    MRLOAD_APPROVE_BQ_LOAD: "{{ approve_bq_load }}"
    MRLOAD_APPROVE_COMPANY_CREATE: "{{ approve_company_create }}"
    MRLOAD_APPROVE_FILES_UPLOAD: "{{ approve_files_upload }}"
    MRLOAD_APPROVE_FILE_NOTES_POST: "{{ approve_file_notes_post }}"

  tasks:
    - name: Install python dependencies
      command: "{{ python }} -m pip install -q -r requirements.txt"
      args:
        chdir: "{{ repo_root }}"

    - name: Walk the scope root (Drive API DFS → hierarchy CSV + silver preview)
      command: >
        {{ python }} -m pipeline.library_files.runner walk
        --root "{{ scope_root }}"
        --hierarchy-out "{{ hierarchy_csv }}"
        --silver-preview-out "{{ silver_preview_csv }}"
      args:
        chdir: "{{ repo_root }}"
      register: walk_out

    - name: Show walk stats
      debug:
        msg: "{{ walk_out.stdout | from_json }}"

    - name: Load hierarchy into BigQuery (gated by approve_bq_load)
      command: >
        {{ python }} -m pipeline.library_files.runner bq-load
        --dataset "{{ bq_raw_dataset }}" --source-uri "{{ hierarchy_csv }}" --replace
      args:
        chdir: "{{ repo_root }}"

    - name: dbt deps
      command: dbt deps --profiles-dir . --target "{{ dbt_target }}"
      args:
        chdir: "{{ repo_root }}/dbt"
      when: approve_bq_load == "1"

    - name: dbt run (silver layer)
      command: dbt run --profiles-dir . --target "{{ dbt_target }}"
      args:
        chdir: "{{ repo_root }}/dbt"
      when: approve_bq_load == "1"

    - name: dbt test (cardinality contract)
      command: dbt test --profiles-dir . --target "{{ dbt_target }}"
      args:
        chdir: "{{ repo_root }}/dbt"
      when: approve_bq_load == "1"

    - name: Resolve company folders → HubSpot companies (create gated)
      command: >
        {{ python }} -m pipeline.library_files.runner companies
        --hierarchy "{{ hierarchy_csv }}" --ledger "{{ ledger_path }}"
      args:
        chdir: "{{ repo_root }}"
      register: companies_out
      failed_when: companies_out.rc not in [0, 1]

    - name: Attach assets as notes on their company (two gates)
      command: >
        {{ python }} -m pipeline.library_files.runner attach
        --hierarchy "{{ hierarchy_csv }}" --ledger "{{ ledger_path }}"
      args:
        chdir: "{{ repo_root }}"
      register: attach_out
      failed_when: attach_out.rc not in [0, 1]
