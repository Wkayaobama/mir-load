# Two targets: `dev` = user OAuth (Cloud Shell / localhost after `gcloud auth
# application-default login`), `runner` = service-account keyfile (VM / CI).
mr_load_bigquery:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('MRLOAD_BQ_PROJECT') }}"
      dataset: "{{ env_var('MRLOAD_BQ_DATASET', 'mrload') }}"
      location: "{{ env_var('MRLOAD_BQ_LOCATION', 'EU') }}"
      threads: 4
      job_execution_timeout_seconds: 300
    runner:
      type: bigquery
      method: service-account
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"
      project: "{{ env_var('MRLOAD_BQ_PROJECT') }}"
      dataset: "{{ env_var('MRLOAD_BQ_DATASET', 'mrload') }}"
      location: "{{ env_var('MRLOAD_BQ_LOCATION', 'EU') }}"
      threads: 4
    # e2e rehearsal: the same models + tests on DuckDB over the CSV artefacts
    duckdb:
      type: duckdb
      path: "{{ env_var('MRLOAD_DUCKDB_PATH', '../.mrload/rehearsal.duckdb') }}"
      threads: 1
